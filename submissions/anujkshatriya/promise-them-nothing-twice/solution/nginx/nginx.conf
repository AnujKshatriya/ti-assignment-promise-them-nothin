worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Round-robin across all 3 stateless application nodes.
  # No ip_hash — no sticky sessions (PRD §11).
  upstream app_nodes {
    server node1:3000;
    server node2:3000;
    server node3:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass         http://app_nodes;
      proxy_http_version 1.1;

      # Required for upstream keepalive with HTTP/1.1.
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
    }
  }
}
